<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1 style="text-align: center; color: red; font-size: 50px;"><i><u>Table</u></i>
        <hr size="5" color="black">
        <table border="1" style="width: 70%; font-size: 40px;">
            <tr>
                <th colspan="4">student</th>
            </tr>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Score</th>
            </tr>
            <tr align="center">
                <td colspan="3">A</td>
                <td>B</td>
            </tr>
            <tr>
                <td rowspan="2">A</td>
                <td>B</td>
                <td colspan="2">C</td>
            </tr>
            <tr>
               <td>A</td>
               <td colspan="2">B</td>
            </tr>

        </table>
    </h1>
</body>
</html>
