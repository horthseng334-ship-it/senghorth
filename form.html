<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    
    <h1 style="text-align: center; color: rgb(50, 50, 114); font-size: 58px;">Login Form</h1>
    <hr size="5" color="yellow">

    <form action="" style="border: 2px solid red; padding: 15px; border-radius: 15px; width: 40%; height: 50vh; margin: auto;">
        <h2 style="color: black; background-color: rgb(105, 95, 87); text-align: center; font-family: 40px 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Login</h2>
        
        <label for="Email">Email</label><br>
        <input type="text" placeholder="Enter Your Email" style="width: 90%; height: 45px; font-size: 20px; border-radius: 15px; margin-top: 6px;"><br>
        
        <label for="password">Password</label><br>
        <input type="password" placeholder="Enter Your Password" style="width: 90%; height: 45px; font-size: 20px; border-radius: 15px; margin-top: 6px;"><br>
        
        <p style="font-size: 15px; text-align: center; color: rgb(50, 25, 159);">Remember me Forget Password</p>
        
        <button style="width: 98%; font-size: 20px; height: 48px; border-radius: 15px;">Login</button>
        
        <p>Forget Password</p>
    </form>

</body>
</html>
