<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body style="background-image: url(img/sea.jpg);background-size: cover;">
    <form action="" style="width: 30vw; height: 70vh; background-color: rgba(67, 137, 173, 0.293); border: 2px solid rgb(131, 162, 192);border-radius: 15px; margin: 90px auto;">
        <h2 style="font-size: 50px;" align="center">Register</h2>
        <Label  style="font-size: 30px; margin-left: 10px;" for="">User </Label><br>
        <input type="text" placeholder="Enter" style="width: 90%; height: 40px; margin-left: 20px; border-radius: 10px;">

        <Label  style="font-size: 30px; margin-left: 10px;" for=""> Email </Label><br>
        <input type="text" placeholder="Enter your email" style="width: 90%; height: 30px; margin-left: 20px; border-radius: 10px;">

        <Label  style="font-size: 30px; margin-left: 10px; margin-top: 20px ;" for="">Password </Label><br>
        <input type="text" placeholder="Enter your password" style="width: 90%; height: 30px; margin-left: 20px; border-radius: 10px; margin-top: 5px;">
        <button style="width: 91%;height: 40px; margin-left: 20px; border-radius: 10px; color: red; margin-top: 10px;">Singup</button>
        <p style="text-align: center;">Or sign Up with</p>
        <button style="width: 91%; height: 40px; margin-left: 20px; border-radius: 10px; border: 0px; background-color: rgb(243, 243, 246);">Google</button>
        <button style="width: 91%; height: 40px; margin-left: 30px; border-radius: 10px;margin-top: 20px; border: 0px; background-color: rgb(41, 41, 117);">Facebook</button>
    </form>
</body>
</html>
