<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body style="background-image: url(img/background.jpg); background-color: rgb(206, 221, 235);">
    <form action="" style="width: 30vw; height: 80vh; border: 2px solid blue; padding: 40px; border-radius: 10px; margin: 90px auto; font-size: 30px;">
        <h1 style="font-size: 50px; text-align: center;">Student registration Form</h1>

        <label for="" style="font-size: 30px;">Full Name:</label><br>
        <input type="text" style="width: 95%; height: 40px; border-radius: 10px;"><br><br>

        <label for="" style="font-size: 30px;">Email Address:</label><br>
        <input type="text" style="width: 95%; height: 40px; border-radius: 10px;"><br><br>

        <label for="" style="font-size: 30px;">Password:</label><br>
        <input type="text" style="width: 95%; height: 40px; border-radius: 10px;"><br><br>

        <label for="" style="font-size: 30px;">Date of Birth:</label><br>
        <input type="date" style="width: 95%; height: 40px;"><br><br>

        <label for="" style="font-size: 30px;">Gender:</label>
        <input type="radio" name="Gender"  value="Female">Female
        <input type="radio" name="Gender" value="Male">Male <br><br>
        
        <label for="" style="font-size: 30px;">Course:</label>
        <select name="" id="">
        <optgroup>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
        </optgroup>
    </select><br><br>
        <Label style="font-size: 30px;">Skills You Have:</Label><br>
        <input type="checkbox">HTML <br>
        <input type="checkbox">CSS <br>

        <label for="" style="font-size: 30px;">Additional Comments</label><br>
        <input type="text" placeholder="Enter your Comments" style="width: 95%; height: 60px;">
        <label for="" style="font-size: 30px;">Upload your file:</label><br>
        <button>Choose File</button>
        <label for="">No file chosen</label><br>
        <button>Upload</button><br>
        <button>Register</button><br>
    </form>
</body>
</html>
