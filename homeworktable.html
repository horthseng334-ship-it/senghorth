<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1 style="text-align: center; color: red; font-size: 50px;"><i><u>Table</u></i>
        <hr size="5" color="black">
        <table border="1" style="width: 70%; font-size: 40px;">
            <tr>
                <th colspan="4">A</th>
            </tr>
            <tr align="center">
                <th rowspan="2">A</th>
                <td>B</td>
                <td>C</td>
                <td rowspan="2">D</td>
            </tr>
            <tr align="center">
                <td>E</td>
                <td>F</td>
            </tr>
            <tr align="center">
                <td colspan="2">G</td>
                <td colspan="2">H</td>
            </tr>
            <tr align="center">
               <td rowspan="2" colspan="2">I</td>
               <td>J</td>
               <td>K</td>               
            </tr>
            <tr align="center">
               <td colspan="2">L</td>
            </tr>

        </table>
    </h1>
</body>
</html>
