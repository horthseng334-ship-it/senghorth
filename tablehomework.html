            <td>English</td>
            <td>Maths</td>
            <td>Sports</td>
          </tr>

            <td colspan="5">Lunch</td>
          </tr>
          <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>

          </tr>

</body>
</html>
